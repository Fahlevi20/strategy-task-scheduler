name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install linter
        run: python -m pip install ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m unittest discover -s tests -v
